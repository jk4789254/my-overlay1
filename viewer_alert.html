<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
</head>
<body style="margin:0; padding:0; overflow:hidden; background-color:transparent; width:1920px; height:1080px;">
<div id="viewer-container" style="position:absolute; bottom:50px; left:50%; transform:translateX(-50%); display:none; flex-direction:column; align-items:center; z-index:9999; user-select:none;">
    <!-- Аватарка по умолчанию -->
    <div class="avatar">👤</div>
    
    <!-- Никнейм -->
    <div id="viewer-name"></div>
</div>
<script>
const TWITCH_CHANNEL = "flux173"; // ВАЖНО: замените на свой канал без "@"
let lastBounceTime = 0;
const bounceCooldown = 1000;

// Подключаемся к Twitch PubSub
function connectToPubSub() {
    const socket = new WebSocket('wss://pubsub-edge.twitch.tv');

    let nonce = Math.random().toString(36);

    // Отправляем сообщение о подписке на события чата
    socket.send(JSON.stringify({
        type: 'LISTEN',
        nonce,
        data: { topics: [`chat_moderator_actions.v1.${TWITCH_CHANNEL}`], auth_token: '' }
    }));

    socket.onmessage = function(event) {
        try {
            const message = JSON.parse(event.data);
            
            if (!message || !message.data || !Array.isArray(message.data.messages)) return;

            for(let msg of message.data.messages) {
                // Ищем только обычные текстовые сообщения
                if(msg.type === 'message' && msg.message_type === 'privmsg') {
                    handleMessage(msg.user_display_name, msg.user_avatar);
                }
            }
        } catch(e) {}
    };
}

function handleMessage(name, avatarUrl) {
    const container = document.getElementById("viewer-container");
    const nameTag = document.getId("viewer-name");
    const avatar = document.querySelector('.avatar');

    updateAvatar(avatarUrl);

    if (container.style.display === '' || container.style.display === 'none') {
        container.style.display = 'flex';
        setTimeout(() => {
            nameTag.textContent = name || '';
            nameTag.style.opacity = '1';
        }, 300);
    } else {
        nameTag.textContent = name || '';
        
        const currentTime = Date.now();
        if (currentTime - lastBounceTime > bounceCooldown) {
            avatar.classList.add('bounce');
            setTimeout(() => avatar.classList.remove('bounce'), 600);
            lastBounceTime = currentTime;
        }
    }
}

function updateAvatar(imgSrc) {
    const avatarEl = document.querySelector('.avatar');
    if (imgSrc && !avatarEl.tagName.toLowerCase().includes('img')) {
        const img = document.createElement('img');
        img.src = imgSrc;
        img.classList.add('avatar');
        avatarEl.replaceWith(img);
        avatarEl = img;
    } else if (imgSrc) {
        avatarEl.src = imgSrc;
    }
}

@keyframes bounce{0%,20%,50%,80%,100%{transform:translateY(0)}40%{transform:translateY(-30px)}60%{transform:translateY(-15px)}}.bounce{animation:bounce .6s ease}
connectToPubSub(); // Стартуем подключение
</script>
</body>
