<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Viewer Alert</title>
    <style>
        /* Обертка, которая занимает весь экран */
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            width: 1920px; /* Укажи свое разрешение стрима */
            height: 1080px;
        }
        
        /* Основной контейнер для человечка */
        #viewer-container {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: none; /* Изначально скрыт */
            flex-direction: column;
            align-items: center;
            z-index: 9999;
            user-select: none;
        }

        /* Сам человечек (можно заменить на картинку) */
        .avatar {
            width: 80px;
            height: 80px;
            background-color: #4CAF50;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 24px;
        }

        /* Ник зрителя */
        #viewer-name {
            margin-top: 10px;
            padding: 5px 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 20px;
            font-family: Arial, sans-serif;
            font-size: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* Анимация подпрыгивания */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-30px); }
            60% { transform: translateY(-15px); }
        }

        .bounce {
            animation: bounce 0.6s ease;
        }
    </style>
</head>
<body>

<div id="viewer-container">
    <div class="avatar">👤</div>
    <div id="viewer-name"></div>
</div>

<script>
    // Настройки
    const WS_URL = "ws://localhost:8080"; // Адрес WebSocket (Streamer.bot по умолчанию)
    const container = document.getElementById('viewer-container');
    const nameTag = document.getElementById('viewer-name');
    const avatar = document.querySelector('.avatar');
    
    // Чтобы человечек не прыгал каждую секунду от спама
    let lastBounceTime = 0;
    const bounceCooldown = 1000; // 1 секунда кд на прыжок

    const socket = new WebSocket(WS_URL);

    socket.onopen = () => {
        console.log("OBS Alert: Connected to WebSocket");
    };

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);

        // Streamer.bot отправляет событие в поле "type" или "event"
        const eventType = data.type || data.event;

        if (eventType === 'viewerJoined') {
            // 1. Зритель зашел
            container.style.display = 'flex';
            nameTag.textContent = '';
            nameTag.style.opacity = '0';
            console.log("Viewer joined, showing avatar");
        }

        if (eventType === 'firstMessage') {
            // 2. Первое сообщение (появляется ник)
            const name = data.name || 'Зритель';
            nameTag.textContent = name;
            // Делаем небольшую задержку, чтобы ник появился плавно после появления аватара
            setTimeout(() => {
                nameTag.style.opacity = '1';
            }, 300);
            console.log("First message from:", name);
        }

        if (eventType === 'newMessage') {
            // 3. Любое следующее сообщение (прыжок)
            const currentTime = Date.now();
            if (currentTime - lastBounceTime > bounceCooldown) {
                avatar.classList.add('bounce');
                // Удаляем класс после завершения анимации, чтобы можно было прыгнуть снова
                setTimeout(() => {
                    avatar.classList.remove('bounce');
                }, 600);
                lastBounceTime = currentTime;
                console.log("Bounce triggered for:", data.name);
            }
        }
    };

    socket.onerror = (err) => {
        console.error("WebSocket Error:", err);
    };
</script>

</body>
</html>
